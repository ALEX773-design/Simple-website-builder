<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web App Builder</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="logo">Builder</div>
      <div class="toolbar-actions">
        <button id="darkModeToggle" title="Toggle Dark Mode">🌙</button>
        <button id="previewBtn" title="Preview">👁</button>
        <button id="saveBtn" title="Save">💾</button>
        <button id="exportBtn" title="Export">📤</button>
        <button id="undoBtn" title="Undo">↩️</button>
        <button id="redoBtn" title="Redo">↪️</button>
        <button id="clearBtn" title="Clear">🧹</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Blocks</h3>
        <button onclick="addBlock('text')"><span class="icon">📝</span><span class="label">Text</span></button>
        <button onclick="addBlock('image')"><span class="icon">🖼</span><span class="label">Image</span></button>
        <button onclick="addBlock('button')"><span class="icon">🔘</span><span class="label">Button</span></button>
        <button onclick="addBlock('heading')"><span class="icon">🔤</span><span class="label">Heading</span></button>
        <button onclick="addBlock('link')"><span class="icon">🔗</span><span class="label">Link</span></button>
        <button onclick="addBlock('divider')"><span class="icon">➖</span><span class="label">Divider</span></button>
        <button onclick="addBlock('input')"><span class="icon">🔲</span><span class="label">Input</span></button>
        <button onclick="addBlock('card')"><span class="icon">📇</span><span class="label">Card</span></button>
        <button onclick="addBlock('form')"><span class="icon">📝</span><span class="label">Form</span></button>
      </aside>

      <button class="toggle-btn" onclick="toggleLayout()" title="Expand or Collapse Workspace">&#8654;</button>

      <main class="builder-container">
        <section id="builder" class="builder-area">
          <p class="placeholder">Start building your app here...</p>
        </section>

        <section id="preview" class="preview-area hidden"></section>
      </main>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <label>Text Color:
      <input type="color" id="textColorPicker" onchange="applySettings()" />
    </label>
    <label>Font Size (px):
      <input type="number" id="fontSizePicker" value="16" onchange="applySettings()" />
    </label>
  </div>

  <div id="exportModal" class="modal hidden">
    <div class="modal-content">
      <h2>Export Clean HTML</h2>
      <textarea id="exportCode" readonly></textarea>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
