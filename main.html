<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web App Builder Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="logo">Builder</div>
      
      <div class="toolbar-center">
        <select id="themeSelect" onchange="applyTheme(this.value)">
          <option value="indigo">Theme: Indigo</option>
          <option value="emerald">Theme: Emerald</option>
          <option value="dark">Theme: Dark</option>
        </select>
      </div>

      <div class="toolbar-actions">
        <button id="previewBtn">Preview</button>
        <button id="saveBtn">Save</button>
        <button id="downloadBtn" class="primary-btn">Download HTML</button>
        <button id="exportBtn">View Code</button>
        <button id="clearBtn" class="danger-btn">Clear</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Add Elements</h3>
        <button onclick="addBlock('heading')">Heading</button>
        <button onclick="addBlock('text')">Text Paragraph</button>
        <button onclick="addBlock('image')">Image</button>
        <button onclick="addBlock('button')">Button</button>
        <button onclick="addBlock('card')">Card Container</button>
        <button onclick="addBlock('divider')">Divider Line</button>
      </aside>

      <main class="builder-container">
        <section id="builder" class="builder-area theme-indigo">
          <p class="placeholder">Select an element from the left sidebar to add it to your canvas.</p>
        </section>

        <section id="preview" class="preview-area hidden theme-indigo"></section>
      </main>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <h4>Inspector</h4>
    <label>Text Color:
      <input type="color" id="textColorPicker" onchange="applySettings()" />
    </label>
    <label>Font Size (px):
      <input type="number" id="fontSizePicker" value="16" onchange="applySettings()" />
    </label>
  </div>

  <div id="exportModal" class="modal hidden">
    <div class="modal-content">
      <h2>Export Source Code</h2>
      <textarea id="exportCode" readonly></textarea>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
