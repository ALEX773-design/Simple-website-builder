<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Web App Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 16px; }
    p { font-size: 1.1rem; color: #94a3b8; max-width: 500px; margin-bottom: 28px; }
    a {
      padding: 12px 24px;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    a:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h1>Web App Builder</h1>
  <p>Create, customize, and export responsive layouts directly in your browser.</p>
  <a href="main.html">Launch App Builder</a>
</body>
</html>
